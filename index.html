<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6bcb">
<title>Callsign Trainer</title>
<style>
:root{--bg:#f3f6fa;--card:#fff;--tx:#1b2733;--mu:#6b7a8a;--pr:#0b6bcb;--prd:#084f96;--ok:#2e9e4f;--okbg:#dff5e5;--bad:#d64545;--badbg:#fde4e4;--bd:#dde4ec;--soft:#eaf1f9}
@media(prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#18222e;--tx:#e8eef4;--mu:#8fa0b2;--pr:#4aa3ff;--prd:#2a6fb8;--ok:#4cc277;--okbg:#153324;--bad:#ff7070;--badbg:#3a1d1f;--bd:#2a3846;--soft:#1f2c3a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px 14px 90px;min-height:100vh}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:17px;margin:18px 0 8px}
.mu{color:var(--mu)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.chips{display:flex;gap:8px}.chip{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.chip b{display:block;font-size:22px}.chip span{font-size:12px;color:var(--mu)}
.pbar{height:12px;background:var(--soft);border-radius:8px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--ok);border-radius:8px;transition:width .3s}
button,.btn{font:inherit;cursor:pointer}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px 16px;font-weight:700;color:#fff;background:var(--pr);box-shadow:0 4px 0 var(--prd);margin:10px 0 6px;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--prd)}
.btn.sec{background:var(--card);color:var(--pr);border:2px solid var(--bd);box-shadow:0 3px 0 var(--bd)}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 #1f7a3a}.btn.bad{background:var(--bad);box-shadow:0 4px 0 #a33}
.btn.sm{display:inline-block;width:auto;padding:7px 12px;font-size:14px;margin:2px}
.btn[disabled]{opacity:.5}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 4px;color:var(--mu);font-size:12px}
nav button b{display:block;font-size:20px}nav button.on{color:var(--pr);font-weight:700}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.top .pbar{flex:1}
.x{border:0;background:none;font-size:22px;color:var(--mu)}
.qcard{text-align:center;padding:18px 8px}
.qlabel{color:var(--mu);font-size:14px;margin-bottom:10px}
.prompt{font-size:38px;font-weight:800;letter-spacing:1px;word-break:break-word}
.spk{border:2px solid var(--bd);background:var(--card);border-radius:50%;width:48px;height:48px;font-size:22px;margin-top:8px}
.spk.big{width:90px;height:90px;font-size:40px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:14px;font-size:18px;font-weight:600;box-shadow:0 3px 0 var(--bd);text-align:left}
.opt i{color:var(--mu);font-style:normal;margin-right:10px;font-size:13px}
.opt.good{border-color:var(--ok);background:var(--okbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.inp{display:flex;gap:8px;margin-top:14px}
input[type=text],input:not([type]),select{font:inherit;width:100%;padding:13px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx)}
input:focus{outline:none;border-color:var(--pr)}
.mic{flex:0 0 52px;border:2px solid var(--bd);background:var(--card);border-radius:12px;font-size:22px}.mic.rec{background:var(--badbg);border-color:var(--bad)}
.fb{position:fixed;left:0;right:0;bottom:0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));z-index:5}
.fb>div{max-width:560px;margin:0 auto}.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.fb h3{margin:0 0 4px}.fb.ok h3{color:var(--ok)}.fb.bad h3{color:var(--bad)}
.item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}
.item .c{font-weight:800;width:52px}.item .t{flex:1;min-width:0}.item .t div:first-child{font-weight:600}
.dots{display:flex;gap:2px}.dots s{width:7px;height:7px;border-radius:50%;background:var(--bd);display:block}.dots s.f{background:var(--ok)}
.ib{border:0;background:none;font-size:16px;padding:4px 6px;color:var(--mu)}
.bars{display:flex;gap:4px;align-items:flex-end;height:90px}.bars div{flex:1;background:var(--soft);border-radius:4px 4px 0 0;position:relative;min-height:3px}.bars div i{position:absolute;bottom:0;left:0;right:0;background:var(--ok);border-radius:4px 4px 0 0}
.lbl{display:flex;gap:4px}.lbl span{flex:1;text-align:center;font-size:10px;color:var(--mu)}
label.ck{display:flex;gap:8px;align-items:center;padding:5px 0}label.ck input{width:20px;height:20px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#1b2733;color:#fff;padding:10px 16px;border-radius:12px;z-index:20;font-size:14px;max-width:90%}
.banner{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
details summary{cursor:pointer;font-weight:700;padding:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-size:44px;font-weight:800;text-align:center;margin:8px 0}
</style>
</head>

const TYPES={c2s:{label:'Code → callsign',need:i=>true},s2c:{label:'Callsign → code',need:i=>true},aud:{label:'Listening → code',need:i=>true,tts:true}};
function mkQ(it){
  let ts=Object.keys(TYPES).filter(k=>S.set.types[k]&&TYPES[k].need(it)&&(!TYPES[k].tts||canTTS));
  if(!ts.length)ts=['c2s'];
  const type=ts[Math.floor(Math.random()*ts.length)];
  const q={item:it,type};
  if(type==='c2s'){q.label='What is the callsign (telephony designator) of this code?';q.pkind='code';q.prompt=it.code;q.akind='call';q.accept=alts(it.call)}
  if(type==='s2c'){q.label='Which ICAO code belongs to this callsign?';q.pkind='call';q.prompt=prim(it.call);q.akind='code';q.accept=[it.code]}
  if(type==='aud'){q.label='Listen: which ICAO code is this?';q.pkind='audio';q.prompt='';q.akind='code';q.accept=[it.code]}
  q.show=q.akind==='code'?it.code:q.akind==='call'?prim(it.call):prim(it.name);
  const p=prog(it.code),box=p?p.box:0;
  q.mc=S.set.mode==='mc'||(S.set.mode==='auto'&&box<=1);
  if(q.mc){
    const val=x=>q.akind==='code'?x.code:q.akind==='call'?prim(x.call):prim(x.name);
    const pool=shuffle(S.items.filter(x=>x.code!==it.code&&val(x)&&norm(val(x))!==norm(q.show)));
    const seenV=new Set(),opts=[];
    for(const x of pool){const v=val(x);if(!seenV.has(norm(v))){seenV.add(norm(v));opts.push(v)}if(opts.length>=3)break}
    opts.push(q.show);q.opts=shuffle(opts);
    if(q.opts.length<2)q.mc=false;
  }
  return q;
}
function match(kind,accept,raw,via){
  if(via==='mc')return{ok:accept.some(a=>norm(a)===norm(raw))};
  if(kind==='code'){const g=via==='voice'?spokenToCode(raw):norm(raw).toUpperCase();return{ok:!!g&&accept.some(a=>norm(a).toUpperCase()===g)}}
  const g=norm(raw);if(!g)return{ok:false};
  for(const a of accept){
    const n=norm(a);if(!n)continue;
    if(g===n)return{ok:true};
    const tol=via==='voice'?(n.length>=8?3:n.length>=5?2:n.length>=4?1:0):(n.length>=6?1:0);
    if(lev(g,n)<=tol)return{ok:true,near:true};
    if(kind==='name'&&n.length>=5&&g.length>=5&&(n.includes(g)||g.includes(n)))return{ok:true,near:true};
  }
  return{ok:false};
}
function check(q,raw,via){const c=Array.isArray(raw)?raw:[raw];for(const r of c){const m=match(q.akind,q.accept,r,via);if(m.ok)return m}return{ok:false}}

/* ============ SELECTION (weighted: harder = more often) ============ */
function weight(it){const p=prog(it.code);if(!p||!p.seen)return 4;const bw=[6,4.5,3,1.8,.9,.4][p.box];const acc=(p.ok+1)/(p.seen+2);let w=bw*(1+2.5*(1-acc));if(Date.now()-p.last<12e4)w*=.3;return w}
function wpick(arr,wf){let t=0;const w=arr.map(a=>{const x=wf(a);t+=x;return x});let r=Math.random()*t;for(let i=0;i<arr.length;i++){r-=w[i];if(r<=0)return arr[i]}return arr[arr.length-1]}
function hardPool(){return S.items.filter(i=>{const p=prog(i.code);return p&&p.seen>=1&&(p.ok/p.seen<.75||p.box<=1)})}
function pickItems(kind){
  let active,n=S.set.len;
  const seen=S.items.filter(isSeen),unseen=shuffle(S.items.filter(i=>!isSeen(i)));
  if(kind==='hard')active=hardPool();
  else if(kind==='new')active=unseen.slice(0,5);
  else active=seen.concat(unseen.slice(0,seen.length<6?5:3));
  if(!active.length)return[];
  n=Math.min(n,active.length*3);
  const out=[];
  for(let k=0;k<n;k++){let it,g=0;do{it=wpick(active,weight)}while(out.length&&out[out.length-1]===it&&active.length>1&&++g<12);out.push(it)}
  return out;
}

/* ============ SESSION ============ */
let libOpen=false,view='home',sess=null,libQ='',form={code:'',call:'',name:'',ctry:'',editing:null},listening=false;
function startSession(kind){
  const items=pickItems(kind);
  if(!items.length){toast(kind==='hard'?'No difficult callsigns yet – practise a few rounds first.':kind==='new'?'You have already seen everything!':'No callsigns available.');return}
  sess={kind,queue:items,i:0,ok:0,bad:0,missed:{},retried:{},startKnown:knownCount(),fb:null,cur:null};
  view='session';present();
}
function present(){
  if(sess.i>=sess.queue.length){view='summary';render();return}
  sess.cur=mkQ(sess.queue[sess.i]);sess.fb=null;render();
  if(sess.cur.type==='aud'||(S.set.auto&&sess.cur.pkind==='call'))setTimeout(()=>say(prim(sess.cur.item.call)),250);
}
function record(it,ok,via){
  const p=S.prog[it.code]||(S.prog[it.code]={box:0,seen:0,ok:0,streak:0,last:0});
  p.seen++;p.last=Date.now();
  if(ok){p.ok++;p.streak++;p.box=via==='mc'?Math.min(p.box+1,Math.max(p.box,3)):Math.min(5,p.box+1)}
  else{p.streak=0;p.box=Math.max(0,p.box-2)}
  const k=dkey(new Date());const l=S.log[k]||(S.log[k]={n:0,ok:0});l.n++;if(ok)l.ok++;
}
function submit(raw,via){
  if(!sess||sess.fb)return;
  const q=sess.cur,res=via==='skip'?{ok:false}:check(q,raw,via);
  record(q.item,res.ok,via);
  sess.fb={ok:res.ok,near:res.near,given:via==='skip'?'':(Array.isArray(raw)?raw[0]:raw),via};
  if(res.ok){sess.ok++;S.xp+=10}else{sess.bad++;sess.missed[q.item.code]=q.item;if(!sess.retried[q.item.code]){sess.retried[q.item.code]=1;sess.queue.push(q.item)}}
  save();render();
  if(q.type!=='aud'&&S.set.auto===false&&!res.ok){}
}
function next(){sess.i++;present()}

function listen(){
  if(!SR||!sess||sess.fb)return;
  if(listening){return}
  const r=new SR();r.lang='en-US';r.maxAlternatives=5;r.interimResults=false;listening=true;updMic();
  r.onresult=e=>{const alts=[...e.results[0]].map(a=>a.transcript);const inp=$('#ans');if(inp)inp.value=sess&&sess.cur&&sess.cur.akind==='code'?spokenToCode(alts[0]):alts[0];submit(alts,'voice')};

}

/* ============ CSV ============ */
function parseCSV(t){
  t=t.replace(/^﻿/,'');const first=t.split(/\r?\n/)[0]||'';
  const d=[';','\t',','].map(c=>[c,first.split(c).length-1]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===d){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[]}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
function rowsToItems(rows){
  if(!rows.length)return[];
  let m={code:0,call:1,name:2,ctry:3},start=0;
  const h=rows[0].map(norm),find=(...k)=>h.findIndex(x=>k.some(y=>x.includes(y)));
  if(h.some(x=>['code','icao','ident','designator'].some(k=>x.includes(k)))){
    start=1;const f={code:find('code','icao','ident','designator'),call:find('callsign','telephony','radio'),name:find('maatschappij','airline','naam','name','operator'),ctry:find('land','country')};
    for(const k in m)if(f[k]>=0)m[k]=f[k];
  }
  const out=[];
  for(let i=start;i<rows.length;i++){const r=rows[i];
    const code=String(r[m.code]||'').trim().toUpperCase(),call=String(r[m.call]||'').trim();
    if(!code||!call)continue;
    out.push({code,call,name:String(r[m.name]||'').trim(),ctry:enC(String(r[m.ctry]||'').trim())});
  }
  return out;
}
async function inflateRaw(u8){const ds=new DecompressionStream('deflate-raw');const w=ds.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer())}
async function unzip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);let e=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-70000);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
  if(e<0)throw new Error('not a zip');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const meth=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));
    files[name]={meth,cs,lo};p+=46+nl+xl+cl;
  }
  const get=async name=>{const f=files[name];if(!f)return null;const ln=dv.getUint16(f.lo+26,true),lx=dv.getUint16(f.lo+28,true),s=f.lo+30+ln+lx,d=u8.subarray(s,s+f.cs);return new TextDecoder().decode(f.meth===0?d:await inflateRaw(d))};
  return{names:Object.keys(files),get};
}
async function xlsxToRows(buf){
  const z=await unzip(buf),P=s=>new DOMParser().parseFromString(s,'application/xml');
  const sst=[];const ss=await z.get('xl/sharedStrings.xml');
  if(ss)P(ss).querySelectorAll('si').forEach(si=>sst.push([...si.querySelectorAll('t')].map(x=>x.textContent).join('')));
  const sheets=z.names.filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort((a,b)=>parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]));
  if(!sheets.length)throw new Error('no worksheet');
  const doc=P(await z.get(sheets[0])),rows=[];
  doc.querySelectorAll('sheetData > row').forEach(r=>{
    const row=[];
    r.querySelectorAll('c').forEach(c=>{
      const ref=c.getAttribute('r')||'';let col=0;for(const ch of ref.replace(/[0-9]/g,''))col=col*26+ch.charCodeAt(0)-64;col--;
      const ty=c.getAttribute('t'),v=c.querySelector('v');let val='';
      if(ty==='s'&&v)val=sst[+v.textContent]||'';else if(ty==='inlineStr')val=[...c.querySelectorAll('t')].map(x=>x.textContent).join('');else if(v)val=v.textContent;
      row[col]=val;
    });
    for(let i=0;i<row.length;i++)if(row[i]==null)row[i]='';
    rows.push(row);
  });
  return rows.filter(r=>r.some(x=>String(x).trim()));
}
function applyImport(items,mode){
  if(!items.length){toast('No usable rows found (code + callsign required).');return}
  let add=0,upd=0;
  if(mode==='replace'){const seen=new Set();S.items=items.filter(i=>!seen.has(i.code)&&seen.add(i.code));add=S.items.length}
  else{items.forEach(i=>{const ix=S.items.findIndex(x=>x.code===i.code);if(ix>=0){S.items[ix]=Object.assign({},S.items[ix],i);upd++}else{S.items.push(i);add++}})}
  S.starter=false;save();render();toast(add+' added'+(upd?', '+upd+' updated':''));
}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC[(c^u8[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  for(const[name,text]of files){
    const nm=enc.encode(name),data=enc.encode(text),crc=crc32(data);
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(nm.length),...u16(0)]);
    parts.push(lh,nm,data);
    cd.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
    off+=lh.length+nm.length+data.length;
  }
  const cdLen=cd.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cdLen),...u32(off),0,0]);
  return new Blob([...parts,...cd,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function toXLSX(){
  const x=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
  const col='ABCD';
  const rows=[['code','callsign','airline','country']].concat(S.items.map(i=>[i.code,i.call,i.name||'',i.ctry||'']));
  const sd=rows.map((r,ri)=>'<row r="'+(ri+1)+'">'+r.map((v,ci)=>v===''?'':'<c r="'+col[ci]+(ri+1)+'" t="inlineStr"><is><t xml:space="preserve">'+x(v)+'</t></is></c>').join('')+'</row>').join('');
  const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  return zipStore([
    ['[Content_Types].xml',H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'],
    ['_rels/.rels',H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ['xl/workbook.xml',H+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Callsigns" sheetId="1" r:id="rId1"/></sheets></workbook>'],
    ['xl/_rels/workbook.xml.rels',H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'],
    ['xl/worksheets/sheet1.xml',H+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+sd+'</sheetData></worksheet>']
  ]);
}

function toCSV(){

  const mx=Math.max(1,...days.map(d=>d.n));
  h+='<h2>Last 14 days</h2><div class="card"><div class="bars">'+days.map(d=>'<div style="height:'+Math.round(d.n/mx*100)+'%"><i style="height:'+(d.n?Math.round(d.ok/d.n*100):0)+'%"></i></div>').join('')+'</div><div class="lbl">'+days.map(d=>'<span>'+d.l+'</span>').join('')+'</div><div class="small mu" style="margin-top:6px">Height = number of answers, green = correct share.</div></div>';
  h+='<h2>Per level</h2><div class="card">'+by.map((n,b)=>'<div class="row small" style="margin:4px 0"><span style="flex:0 0 90px">Level '+b+(b>=4?' ✓':'')+'</span><div class="pbar" style="flex:1"><i style="width:'+(tot?Math.round(n/tot*100):0)+'%"></i></div><span style="flex:0 0 36px;text-align:right">'+n+'</span></div>').join('')+'<div class="small mu">Level 4–5 counts as “known”. Correct answer = +1, wrong = −2. Multiple choice takes you to level 3 at most; typing/speaking is needed for “known”.</div></div>';
  const hard=S.items.filter(i=>{const p=prog(i.code);return p&&p.seen>=2}).map(i=>{const p=prog(i.code);return{i,p,acc:p.ok/p.seen}}).sort((a,b)=>a.acc-b.acc||b.p.seen-a.p.seen).slice(0,10);
  h+='<h2>Hardest callsigns</h2><div class="card" style="padding:4px 14px">'+(hard.length?hard.map(x=>'<div class="item"><div class="c">'+esc(x.i.code)+'</div><div class="t"><div>'+esc(prim(x.i.call))+'</div><div class="small mu">'+esc(x.i.name||'')+'</div></div><div class="small">'+Math.round(x.acc*100)+'% <span class="mu">('+x.p.seen+'×)</span></div></div>').join(''):'<div class="small mu" style="padding:8px">Not enough data yet.</div>')+'</div>';
  return h;
}
function render(){
  const app=$('#app');let h='';
  if(view==='home')h=renderHome();else if(view==='session')h=renderSession();else if(view==='summary')h=renderSummary();else if(view==='lib')h=renderLib();else if(view==='stats')h=renderStats();
  app.innerHTML=h+(view==='session'||view==='summary'?'':nav());
  if(view==='session'&&sess.cur&&!sess.cur.mc&&!sess.fb){const i=$('#ans');if(i&&!('ontouchstart' in window&&false))i.focus()}
  if(view!=='session')window.scrollTo(0,0);
}

/* ============ EVENTS ============ */
function readForm(){['code','call','name','ctry'].forEach(k=>{const e=$('#f_'+k);if(e)form[k]=e.value})}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==='go'){if(view==='lib')readForm();view=v;render()}
  else if(a==='start')startSession(v);
  else if(a==='quit'){try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}view='home';sess=null;render();toast('Round stopped – your progress is saved.')}
  else if(a==='say'){if(sess&&sess.cur)say(prim(sess.cur.item.call))}
  else if(a==='sayit'){const it=S.items.find(x=>x.code===v);if(it)say(prim(it.call))}
  else if(a==='opt'){const q=sess.cur;submit(q.opts[+v],'mc')}
  else if(a==='check'){const i=$('#ans');submit(i?i.value:'','type')}
  else if(a==='skip')submit('','skip');
  else if(a==='next')next();
  else if(a==='mic')listen();
  else if(a==='saveitem')saveItem();
  else if(a==='gsimport')importSheetUrl();
  else if(a==='cancel'){form={code:'',call:'',name:'',ctry:'',editing:null};render()}
  else if(a==='edit'){const it=S.items.find(x=>x.code===v);if(it){form={code:it.code,call:it.call,name:it.name||'',ctry:it.ctry||'',editing:it.code};render();window.scrollTo(0,0)}}
  else if(a==='del'){ask('Delete callsign '+v+'?',()=>{S.items=S.items.filter(x=>x.code!==v);delete S.prog[v];save();$('#list').innerHTML=listHTML()})}
  else if(a==='expcsv')download('callsigns.csv',toCSV(),'text/csv');
  else if(a==='expxlsx'){const bl=toXLSX(),u=document.createElement('a');u.href=URL.createObjectURL(bl);u.download='callsigns.xlsx';document.body.appendChild(u);u.click();setTimeout(()=>{URL.revokeObjectURL(u.href);u.remove()},500)}
  else if(a==='copytable')copyTable();
  else if(a==='expjson')download('callsign-trainer-backup-'+dkey(new Date())+'.json',JSON.stringify(S),'application/json');
  else if(a==='resetprog'){ask('Clear all progress and statistics? (The list stays.)',()=>{S.prog={};S.log={};S.xp=0;save();render();toast('Progress cleared')})}
  else if(a==='resetall'){ask('Reset everything to the default list?',()=>{S=fresh();save();render();toast('Reset done')})}
});
function saveItem(){
  readForm();
  const code=form.code.trim().toUpperCase(),call=form.call.trim();
  if(!/^[A-Z0-9]{2,4}$/.test(code)){toast('Code: 2 to 4 letters/digits.');return}
  if(!call){toast('Enter a callsign.');return}
  const it={code,call,name:form.name.trim(),ctry:form.ctry.trim()};
  const old=form.editing;
  if(old&&old!==code){S.items=S.items.filter(x=>x.code!==old);if(S.prog[old]){S.prog[code]=S.prog[old];delete S.prog[old]}}
  const ix=S.items.findIndex(x=>x.code===code);
  if(ix>=0){S.items[ix]=it;toast(code+' updated')}else{S.items.push(it);toast(code+' added')}
  form={code:'',call:'',name:'',ctry:'',editing:null};save();render();
}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.set==='type'){S.set.types[t.dataset.k]=t.checked?1:0;if(!Object.values(S.set.types).some(Boolean)){S.set.types.c2s=1;render()}save()}
  else if(t.dataset.set==='mode'){S.set.mode=t.value;save()}
  else if(t.dataset.set==='len'){S.set.len=+t.value;save();render()}
  else if(t.dataset.set==='auto'){S.set.auto=t.checked;save()}
  else if(t.id==='csvfile'&&t.files[0]){
    const f=t.files[0],mode=impMode();
    if(/\.xlsx$/i.test(f.name)){
      f.arrayBuffer().then(xlsxToRows).then(rows=>applyImport(rowsToItems(rows),mode)).catch(()=>toast('Could not read the Excel file. Try CSV.'));
    }else{
      const fr=new FileReader();fr.onload=()=>applyImport(rowsToItems(parseCSV(String(fr.result))),mode);fr.readAsText(f);
    }
    t.value='';
  }
  else if(t.id==='jsonfile'&&t.files[0]){
    const fr=new FileReader();fr.onload=()=>{try{const r=JSON.parse(String(fr.result));if(!r.items)throw 0;ask('Replace current data with this backup?',()=>{S=Object.assign(fresh(),r);S.set=Object.assign(fresh().set,r.set||{});save();render();toast('Backup restored')})}catch(e){toast('Invalid backup file.')}};fr.readAsText(t.files[0]);
  }
});
document.addEventListener('toggle',e=>{if(e.target.id==='impbox')libOpen=e.target.open},true);
document.addEventListener('input',e=>{
  if(e.target.id==='ans'&&sess&&sess.cur&&sess.cur.akind==='code'){const el=e.target,s=el.selectionStart,u=el.value.toUpperCase();if(u!==el.value){el.value=u;try{el.setSelectionRange(s,s)}catch(x){}}}
  if(e.target.id==='search'){libQ=e.target.value;const l=$('#list');if(l)l.innerHTML=listHTML()}
});
document.addEventListener('keydown',e=>{
  if(view!=='session'||!sess||!sess.cur)return;
  if(e.key==='Enter'){e.preventDefault();if(sess.fb)next();else if(!sess.cur.mc){const i=$('#ans');submit(i?i.value:'','type')}}
  else if(sess.cur.mc&&!sess.fb&&/^[1-4]$/.test(e.key)){const o=sess.cur.opts[+e.key-1];if(o!=null)submit(o,'mc')}
});

render();
})();
</script>
</body>
</html>
